name: Fix slope menu now
on:
  push:
    paths:
      - .github/workflows/fix-slope-menu-now.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing slope menu item
        run: |
          python - <<'PY'
          from pathlib import Path
          item='<a href="/slope-seismic-vulnerability/"><span class="hd-dd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18"/><path d="M5 19L14 6l5 13"/><path d="M9.5 12.5l8.5 1"/></svg></span><span class="hd-dd-lbl">Slope Seismic Vulnerability</span></a>'
          marker='<div class="hd-dd-cat">Structural Analysis</div>'
          changed=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.py'} or '.git' in p.parts:
                  continue
              try:s=p.read_text(encoding='utf-8')
              except:continue
              if marker in s and 'Slope Seismic Vulnerability' not in s:
                  p.write_text(s.replace(marker,item+marker,1),encoding='utf-8')
                  changed.append(str(p))
          print('\n'.join(changed))
          if not changed:
              print('No missing copies found')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fix slope vulnerability in tools menu"
          git push
